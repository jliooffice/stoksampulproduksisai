<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Stok Sampul Produksi SAI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f3f6fb;
padding:16px;
color:#1f2937;
}

.wrap{
max-width:430px;
margin:auto;
}

.card{
background:#fff;
border-radius:18px;
padding:18px;
box-shadow:0 4px 14px rgba(0,0,0,.06);
}

.title{
font-size:26px;
font-weight:700;
text-align:center;
color:#1565c0;
margin-bottom:14px;
}

.updateBox{
padding:12px;
border-radius:14px;
text-align:center;
font-size:15px;
font-weight:700;
margin-bottom:16px;
background:#e5e7eb;
}

.label{
font-size:14px;
font-weight:700;
margin-bottom:8px;
}

input{
width:100%;
height:52px;
padding:0 14px;
font-size:17px;
border:1px solid #d1d5db;
border-radius:14px;
outline:none;
margin-bottom:12px;
}

input:focus{
border-color:#1976d2;
}

/* Tombol Search */
button{
width:100%;
height:52px;
border:none;
border-radius:14px;
background:#d4ff00;
color:#000000;
font-size:17px;
font-weight:700;
margin-bottom:16px;
cursor:pointer;
}

button:active{
transform:scale(.99);
}

.qty{
min-height:110px;
border-radius:16px;
background:#1976d2;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:16px;
font-size:42px;
font-weight:700;
color:#fff;
word-break:break-word;
}

.popup{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
display:flex;
justify-content:center;
align-items:center;
padding:16px;
}

.popupBox{
background:#fff;
width:100%;
max-width:360px;
border-radius:18px;
padding:20px;
}

.popupTitle{
font-size:20px;
font-weight:700;
text-align:center;
margin-bottom:12px;
}

.hidden{
display:none;
}
</style>
</head>

<body>

<div class="wrap">
<div class="card">

<div class="title">Stok Sampul Produksi SAI</div>

<div id="updateBox" class="updateBox">Memuat data...</div>

<div class="label">Cari Produk</div>

<input
list="products"
id="produk"
placeholder="Ketik nama produk..."
autocomplete="off"
onclick="this.value='';clearQty();"
onfocus="this.value='';clearQty();">

<datalist id="products"></datalist>

<button onclick="cekProduk()">Search</button>

<div class="qty" id="qty"></div>

</div>
</div>

<div class="popup" id="popup">
<div class="popupBox">

<div class="popupTitle">Masukkan Nama Anda</div>

<input type="text" id="nama" placeholder="Nama pengguna">

<button onclick="saveNama()">Masuk</button>

</div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycby1LxwwpHdD5LI4qufHQ-CNQX5LbkuxSTvrCB00s9QdvEJUlwxrwkZrZd9iUcdkZvM7/exec";

const produkInput = document.getElementById("produk");
const qtyBox = document.getElementById("qty");
const updateBox = document.getElementById("updateBox");
const list = document.getElementById("products");

let username = localStorage.getItem("username") || "";

if(username){
document.getElementById("popup").classList.add("hidden");
}

function saveNama(){
let nama = document.getElementById("nama").value.trim();

if(!nama) return;

localStorage.setItem("username", nama);
username = nama;

document.getElementById("popup").classList.add("hidden");
}

function clearQty(){
qtyBox.innerText = "";
}

async function loadProducts(){
try{
let res = await fetch(API + "?action=getProducts");
let data = await res.json();

let html = "";

data.forEach(x=>{
html += `<option value="${x.nama}">`;
});

list.innerHTML = html;

}catch(err){}
}

async function loadUpdateDate(){
try{
let res = await fetch(API + "?action=getUpdateDate");
let data = await res.json();

updateBox.innerText = "Update: " + data.date;

if(data.status === "green"){
updateBox.style.background = "#82ff46";
}else{
updateBox.style.background = "#ff4646";
}

}catch(err){
updateBox.innerText = "Gagal memuat data";
}
}

async function cekProduk(){

let produk = produkInput.value.trim();

if(!produk){
clearQty();
return;
}

qtyBox.innerText = "Tunggu Sebentar...";

let url =
API +
"?action=search" +
"&product=" + encodeURIComponent(produk) +
"&user=" + encodeURIComponent(username) +
"&device=" + encodeURIComponent(navigator.userAgent);

try{
let res = await fetch(url);
let data = await res.json();

qtyBox.innerText = data.qty;

}catch(err){
qtyBox.innerText = "Error";
}
}

loadProducts();
loadUpdateDate();
</script>

</body>
</html>
